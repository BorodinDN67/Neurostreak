name: 'NeuroStreak_0.0.1'

head:
  spectral_dim: 64
  wavelet_dim: 512
  embedding_dim: 128

backbone:
  hidden_2d_dim_1: 64
  hidden_2d_dim_2: 128
  kernel_size: [3,3]
  padding: [1,1]
  num_heads: 8
  embed_dim: 512
  depth: 8
  max_pool_kernel_size_1: [2,2]
  max_pool_stride_1: [2,2]
  max_pool_kernel_size_2: [2,2]
  max_pool_stride_2: [2,2]
  max_pool_kernel_size_3: [2,2]
  max_pool_stride_3: [2,2]
  num_scales: 64

embedding:
  max_amp: 50
  step: 0.5
  wavelet: 'gaus2'
